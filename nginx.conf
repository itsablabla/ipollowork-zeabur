# Only advertise a connection upgrade when the client actually asked for one.
# Sending `Connection: upgrade` on ordinary requests makes the iPolloWork
# server's proxy to OpenCode fail with 502 provider_network_error.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The SPA ships ~10 MB of uncompressed JavaScript. Assets are pre-compressed at
  # build time and served with gzip_static, which keeps compression off the
  # request path and lets nginx send a Content-Length (dynamic gzip uses chunked
  # encoding and is far slower to deliver through the platform edge). gzip stays
  # on for the JSON the API returns.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_static on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Agent artifacts and workspace uploads can be large.
  client_max_body_size 512m;

  # Single origin: the SPA talks to the iPolloWork host through these paths
  # (`${origin}/opencode` for the engine, plus the server's own REST surface).
  location ~ ^/(opencode|workspaces|workspace|w|health|status|capabilities|whoami|tokens|approvals|files|runtime|experimental|mcp|commands|skills|audit|export|import|sandbox)(/|$) {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # The host's own toy UI and its assets.
  location /ui {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # SPA (BrowserRouter) — deep links fall back to index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
