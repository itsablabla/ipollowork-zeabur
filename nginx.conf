server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Agent artifacts and workspace uploads can be large.
  client_max_body_size 512m;

  # Single origin: the SPA talks to the iPolloWork host through these paths
  # (`${origin}/opencode` for the engine, plus the server's own REST surface).
  location ~ ^/(opencode|workspaces|workspace|w|health|status|capabilities|whoami|tokens|approvals|files|runtime|experimental|mcp|commands|skills|audit|export|import|sandbox)(/|$) {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # The host's own toy UI and its assets.
  location /ui {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # SPA (BrowserRouter) — deep links fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
